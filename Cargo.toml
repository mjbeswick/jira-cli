[package]
name = "jira-cli"
version = "0.1.0"
edition = "2021"
description = "A scriptable, safe Jira command-line client"
license = "ISC"

[[bin]]
name = "jira"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
pulldown-cmark = "0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
